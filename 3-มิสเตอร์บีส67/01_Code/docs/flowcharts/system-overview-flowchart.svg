<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', 'Tahoma', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SmartBudget - System Overview Flowchart</title>
  <desc>แผนภาพการทำงานภาพรวมของระบบ SmartBudget ตั้งแต่ Login จนถึง Logout</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="600" fill="#FFFFFF"/>

  <!-- Start -->
  <rect x="280" y="30" width="120" height="44" rx="10" fill="#F2F5FA" stroke="#D7DEEA" stroke-width="1"/>
  <text x="340" y="56" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2333">เริ่มต้น</text>

  <line x1="340" y1="74" x2="340" y2="94" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Login -->
  <rect x="230" y="94" width="220" height="56" rx="10" fill="#E7EDFD" stroke="#4472F0" stroke-width="1"/>
  <text x="340" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="#12244A">หน้า Login</text>
  <text x="340" y="136" text-anchor="middle" font-size="12" fill="#2F4A8C">กรอก Username / Password</text>

  <line x1="340" y1="150" x2="340" y2="170" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Decision -->
  <rect x="230" y="170" width="220" height="56" rx="10" fill="#FDF3E1" stroke="#C87A0A" stroke-width="1"/>
  <text x="340" y="192" text-anchor="middle" font-size="14" font-weight="600" fill="#5C3A06">ตรวจสอบข้อมูล</text>
  <text x="340" y="212" text-anchor="middle" font-size="12" fill="#8A5A08">เข้าสู่ระบบสำเร็จหรือไม่</text>

  <!-- loop back on fail -->
  <path d="M230,198 L145,198 L145,122 L230,122" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="152" y="162" text-anchor="start" font-size="12" fill="#6B7280">ไม่สำเร็จ</text>

  <!-- success down -->
  <line x1="340" y1="226" x2="340" y2="246" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="350" y="239" text-anchor="start" font-size="12" fill="#6B7280">สำเร็จ</text>

  <!-- Dashboard -->
  <rect x="230" y="246" width="220" height="56" rx="10" fill="#E7EDFD" stroke="#4472F0" stroke-width="1"/>
  <text x="340" y="268" text-anchor="middle" font-size="14" font-weight="600" fill="#12244A">Dashboard</text>
  <text x="340" y="288" text-anchor="middle" font-size="12" fill="#2F4A8C">ภาพรวมรายรับ-รายจ่าย</text>

  <!-- trunk down to bus -->
  <line x1="340" y1="302" x2="340" y2="322" stroke="#6B7280" stroke-width="1.6"/>
  <!-- horizontal bus -->
  <line x1="98" y1="322" x2="582" y2="322" stroke="#6B7280" stroke-width="1.6"/>

  <!-- 5 drops -->
  <line x1="98" y1="322" x2="98" y2="346" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="219" y1="322" x2="219" y2="346" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="340" y1="322" x2="340" y2="346" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="461" y1="322" x2="461" y2="346" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="582" y1="322" x2="582" y2="346" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Menu row -->
  <g>
    <rect x="42" y="346" width="112" height="56" rx="10" fill="#E7F8F1" stroke="#1FAE7A" stroke-width="1"/>
    <text x="98" y="368" text-anchor="middle" font-size="13" font-weight="600" fill="#0F5C3E">ธุรกรรม</text>
    <text x="98" y="386" text-anchor="middle" font-size="11" fill="#1B7A52">แก้ไขรายการ</text>
  </g>
  <g>
    <rect x="163" y="346" width="112" height="56" rx="10" fill="#E7F8F1" stroke="#1FAE7A" stroke-width="1"/>
    <text x="219" y="368" text-anchor="middle" font-size="13" font-weight="600" fill="#0F5C3E">ค้นหา</text>
    <text x="219" y="386" text-anchor="middle" font-size="11" fill="#1B7A52">ค้นหา+กรอง</text>
  </g>
  <g>
    <rect x="284" y="346" width="112" height="56" rx="10" fill="#E7F8F1" stroke="#1FAE7A" stroke-width="1"/>
    <text x="340" y="368" text-anchor="middle" font-size="13" font-weight="600" fill="#0F5C3E">Optimize</text>
    <text x="340" y="386" text-anchor="middle" font-size="11" fill="#1B7A52">แนะนำการตัด</text>
  </g>
  <g>
    <rect x="405" y="346" width="112" height="56" rx="10" fill="#E7F8F1" stroke="#1FAE7A" stroke-width="1"/>
    <text x="461" y="368" text-anchor="middle" font-size="13" font-weight="600" fill="#0F5C3E">Wishlist</text>
    <text x="461" y="386" text-anchor="middle" font-size="11" fill="#1B7A52">แผนออมเงิน</text>
  </g>
  <g>
    <rect x="526" y="346" width="112" height="56" rx="10" fill="#E7F8F1" stroke="#1FAE7A" stroke-width="1"/>
    <text x="582" y="368" text-anchor="middle" font-size="13" font-weight="600" fill="#0F5C3E">DS &amp; Algo</text>
    <text x="582" y="386" text-anchor="middle" font-size="11" fill="#1B7A52">ดูโครงสร้าง</text>
  </g>

  <text x="340" y="424" text-anchor="middle" font-size="12" fill="#7B879E">หมายเหตุ: กลับมาที่ Dashboard แล้วเลือกเมนูอื่นได้ตลอดเวลา</text>

  <line x1="340" y1="432" x2="340" y2="454" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Logout -->
  <rect x="230" y="454" width="220" height="56" rx="10" fill="#FCEAEB" stroke="#D9414B" stroke-width="1"/>
  <text x="340" y="476" text-anchor="middle" font-size="14" font-weight="600" fill="#7A2328">ออกจากระบบ</text>
  <text x="340" y="496" text-anchor="middle" font-size="12" fill="#9C3D44">ล้าง Session กลับหน้า Login</text>

  <line x1="340" y1="510" x2="340" y2="530" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- End -->
  <rect x="280" y="530" width="120" height="44" rx="10" fill="#F2F5FA" stroke="#D7DEEA" stroke-width="1"/>
  <text x="340" y="556" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2333">สิ้นสุด</text>
</svg>
