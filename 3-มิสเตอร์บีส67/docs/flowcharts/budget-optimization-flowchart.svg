<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="760" viewBox="0 0 680 760" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', 'Tahoma', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SmartBudget - Budget Optimization Algorithm Flowchart</title>
  <desc>แผนภาพขั้นตอนการทำงานของอัลกอริทึม Budget Optimization (Greedy vs 0/1 Knapsack)</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="760" fill="#FFFFFF"/>

  <!-- Start -->
  <rect x="280" y="24" width="120" height="44" rx="10" fill="#F2F5FA" stroke="#D7DEEA" stroke-width="1"/>
  <text x="340" y="50" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2333">เริ่มต้น</text>

  <line x1="340" y1="68" x2="340" y2="88" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- step: calc -->
  <rect x="190" y="88" width="300" height="56" rx="10" fill="#E7EDFD" stroke="#4472F0" stroke-width="1"/>
  <text x="340" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#12244A">คำนวณรายจ่ายรวม และงบประมาณ</text>
  <text x="340" y="130" text-anchor="middle" font-size="12" fill="#2F4A8C">totalExpense, budget จากข้อมูลจริง</text>

  <line x1="340" y1="144" x2="340" y2="164" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- decision: over budget? -->
  <rect x="220" y="164" width="240" height="56" rx="10" fill="#FDF3E1" stroke="#C87A0A" stroke-width="1"/>
  <text x="340" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#5C3A06">รายจ่ายเกินงบประมาณ?</text>
  <text x="340" y="206" text-anchor="middle" font-size="12" fill="#8A5A08">totalExpense &gt; budget</text>

  <!-- No branch: goes right to "within budget" end -->
  <line x1="460" y1="192" x2="520" y2="192" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="470" y="184" text-anchor="middle" font-size="12" fill="#6B7280">ไม่เกิน</text>

  <rect x="520" y="164" width="130" height="56" rx="10" fill="#E7F8F1" stroke="#1FAE7A" stroke-width="1"/>
  <text x="585" y="186" text-anchor="middle" font-size="13" font-weight="600" fill="#0F5C3E">อยู่ในงบ</text>
  <text x="585" y="204" text-anchor="middle" font-size="11" fill="#1B7A52">ไม่ต้องตัดรายการ</text>

  <!-- Yes branch down -->
  <line x1="340" y1="220" x2="340" y2="240" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="350" y="233" text-anchor="start" font-size="12" fill="#6B7280">เกิน</text>

  <!-- compute overBudgetAmount + filter necessity>=3 -->
  <rect x="160" y="240" width="360" height="56" rx="10" fill="#E7EDFD" stroke="#4472F0" stroke-width="1"/>
  <text x="340" y="262" text-anchor="middle" font-size="14" font-weight="600" fill="#12244A">หายอดที่เกินงบ และคัดรายการที่ตัดได้</text>
  <text x="340" y="282" text-anchor="middle" font-size="12" fill="#2F4A8C">overBudgetAmount, necessity &#8805; 3</text>

  <line x1="340" y1="296" x2="340" y2="316" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- decision: method -->
  <rect x="220" y="316" width="240" height="56" rx="10" fill="#FDF3E1" stroke="#C87A0A" stroke-width="1"/>
  <text x="340" y="338" text-anchor="middle" font-size="14" font-weight="600" fill="#5C3A06">ผู้ใช้เลือกวิธีไหน?</text>
  <text x="340" y="358" text-anchor="middle" font-size="12" fill="#8A5A08">Greedy หรือ Knapsack</text>

  <!-- branch left: Greedy -->
  <path d="M220,344 L130,344 L130,392" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="138" y="366" text-anchor="start" font-size="12" fill="#6B7280">Greedy</text>

  <!-- branch right: Knapsack -->
  <path d="M460,344 L550,344 L550,392" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="488" y="366" text-anchor="start" font-size="12" fill="#6B7280">Knapsack</text>

  <!-- Greedy column -->
  <rect x="30" y="392" width="200" height="56" rx="10" fill="#E7F8F1" stroke="#1FAE7A" stroke-width="1"/>
  <text x="130" y="414" text-anchor="middle" font-size="13" font-weight="600" fill="#0F5C3E">เรียงตาม necessity</text>
  <text x="130" y="432" text-anchor="middle" font-size="11" fill="#1B7A52">มาก &#8594; น้อย แล้วเงินมาก &#8594; น้อย</text>

  <line x1="130" y1="448" x2="130" y2="468" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <rect x="30" y="468" width="200" height="56" rx="10" fill="#E7F8F1" stroke="#1FAE7A" stroke-width="1"/>
  <text x="130" y="490" text-anchor="middle" font-size="13" font-weight="600" fill="#0F5C3E">ตัดรายการแรกไปเรื่อยๆ</text>
  <text x="130" y="508" text-anchor="middle" font-size="11" fill="#1B7A52">จนยอดลดพอ หรือ หมดรายการ</text>

  <!-- Knapsack column -->
  <rect x="450" y="392" width="200" height="56" rx="10" fill="#E7F8F1" stroke="#1FAE7A" stroke-width="1"/>
  <text x="550" y="414" text-anchor="middle" font-size="13" font-weight="600" fill="#0F5C3E">สร้างตาราง DP</text>
  <text x="550" y="432" text-anchor="middle" font-size="11" fill="#1B7A52">ขนาดตามยอดเงินที่เกิน</text>

  <line x1="550" y1="448" x2="550" y2="468" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <rect x="450" y="468" width="200" height="56" rx="10" fill="#E7F8F1" stroke="#1FAE7A" stroke-width="1"/>
  <text x="550" y="490" text-anchor="middle" font-size="13" font-weight="600" fill="#0F5C3E">Backtrack หาคำตอบ</text>
  <text x="550" y="508" text-anchor="middle" font-size="11" fill="#1B7A52">ที่ผลกระทบรวมต่ำสุด</text>

  <!-- merge down to cutList -->
  <line x1="130" y1="524" x2="130" y2="548" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="550" y1="524" x2="550" y2="548" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="130" y1="548" x2="340" y2="548" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="550" y1="548" x2="340" y2="548" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="340" y1="548" x2="340" y2="568" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- cutList output -->
  <rect x="190" y="568" width="300" height="56" rx="10" fill="#E7EDFD" stroke="#4472F0" stroke-width="1"/>
  <text x="340" y="590" text-anchor="middle" font-size="14" font-weight="600" fill="#12244A">ได้รายการที่แนะนำให้ตัด</text>
  <text x="340" y="610" text-anchor="middle" font-size="12" fill="#2F4A8C">cutList, totalSaved, เหตุผล</text>

  <line x1="340" y1="624" x2="340" y2="644" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- final decision: achieved -->
  <rect x="220" y="644" width="240" height="56" rx="10" fill="#FDF3E1" stroke="#C87A0A" stroke-width="1"/>
  <text x="340" y="666" text-anchor="middle" font-size="14" font-weight="600" fill="#5C3A06">ตัดแล้วพอกับยอดที่เกินไหม?</text>
  <text x="340" y="686" text-anchor="middle" font-size="12" fill="#8A5A08">totalSaved &#8805; overBudgetAmount</text>

  <path d="M220,672 L130,672 L130,700" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="60" y="694" text-anchor="start" font-size="12" fill="#6B7280">พอ</text>

  <path d="M460,672 L550,672 L550,700" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="486" y="694" text-anchor="start" font-size="12" fill="#6B7280">ยังไม่พอ</text>

  <rect x="30" y="700" width="200" height="50" rx="10" fill="#E7F8F1" stroke="#1FAE7A" stroke-width="1"/>
  <text x="130" y="722" text-anchor="middle" font-size="13" font-weight="600" fill="#0F5C3E">แสดงผลสำเร็จ</text>
  <text x="130" y="738" text-anchor="middle" font-size="11" fill="#1B7A52">กลับมาอยู่ในงบได้</text>

  <rect x="450" y="700" width="200" height="50" rx="10" fill="#FCEAEB" stroke="#D9414B" stroke-width="1"/>
  <text x="550" y="722" text-anchor="middle" font-size="13" font-weight="600" fill="#7A2328">แจ้งเตือนเพิ่มเติม</text>
  <text x="550" y="738" text-anchor="middle" font-size="11" fill="#9C3D44">ยังขาดอีกเท่าไหร่</text>
</svg>
